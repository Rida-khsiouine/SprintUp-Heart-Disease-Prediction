[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-multicohort"
version = "2.0.0"
description = "AI-assisted, leakage-safe heart-disease modeling across four UCI cohorts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Rida-khsiouine"}]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.7,<1.8",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<0.14",
  "skops>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
heart-disease = "heart_disease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["full: computationally expensive full-reproduction tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
